<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Press+Start+2P&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: #0A0A0A;
    color: #E0E0E0;
    font-family: 'Share Tech Mono', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  body::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(255,255,255,0.02) 2px,
      rgba(255,255,255,0.02) 4px
    );
    pointer-events: none;
  }
  .corner-tl, .corner-tr, .corner-bl, .corner-br {
    position: absolute; width: 24px; height: 24px;
  }
  .corner-tl { top: 20px; left: 20px; border-top: 1px solid #333; border-left: 1px solid #333; }
  .corner-tr { top: 20px; right: 20px; border-top: 1px solid #333; border-right: 1px solid #333; }
  .corner-bl { bottom: 20px; left: 20px; border-bottom: 1px solid #333; border-left: 1px solid #333; }
  .corner-br { bottom: 20px; right: 20px; border-bottom: 1px solid #333; border-right: 1px solid #333; }
  .title {
    font-size: 72px;
    letter-spacing: 20px;
    text-transform: uppercase;
    margin-bottom: 16px;
    text-shadow: 0 0 60px rgba(255,255,255,0.1);
  }
  .cursor {
    display: inline-block;
    width: 36px; height: 72px;
    background: #E0E0E0;
    vertical-align: middle;
    margin-left: 4px;
  }
  .sub {
    font-size: 14px;
    letter-spacing: 8px;
    color: #555;
    margin-bottom: 48px;
  }
  .tagline {
    font-size: 18px;
    letter-spacing: 4px;
    color: #666;
    max-width: 700px;
    text-align: center;
    line-height: 1.8;
  }
  .bottom {
    position: absolute;
    bottom: 32px;
    font-size: 10px;
    letter-spacing: 4px;
    color: #333;
  }
  .url {
    position: absolute;
    bottom: 52px;
    font-size: 13px;
    letter-spacing: 6px;
    color: #555;
  }
</style>
</head>
<body>
  <div class="corner-tl"></div>
  <div class="corner-tr"></div>
  <div class="corner-bl"></div>
  <div class="corner-br"></div>
  <div class="title">CAFFEINATE<span class="cursor"></span></div>
  <div class="sub">NEURAL FREQUENCY TERMINAL</div>
  <div class="tagline">BINAURAL FREQUENCIES TUNED FOR FOCUS, WAKEFULNESS, AND SHIPPING CODE AT 3AM</div>
  <div class="url">CAFFEINATE.CLUB</div>
  <div class="bottom">MASTERBLOX LABS // 2026</div>
</body>
</html>
